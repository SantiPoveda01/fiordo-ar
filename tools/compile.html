<!DOCTYPE html><html><body><script type="module">
import { Compiler } from '../js/lib/mindar/mindar-image.prod.js';
const img = new Image(); img.src = '../assets/marker/fiordo-target.png';
await img.decode();
const c = new Compiler();
const data = await c.compileImageTargets([img], p => { window.__p = p; });
window.__features = data.map(d => ({ match: d.matchingData.map(m => m.maximaPoints.length + m.minimaPoints.length), track: d.trackingData.map(t => t.points.length) }));
const buf = await c.exportData();
window.__b64 = btoa(Array.from(new Uint8Array(buf), x => String.fromCharCode(x)).join(''));
window.__done = true;
</script></body></html>
